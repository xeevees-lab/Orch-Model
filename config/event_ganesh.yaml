# Ganesh Chaturthi - Mumbai event definition
#
# IMPORTANT: coordinates below are approximate, placed from general
# knowledge of where these sites are. Verify each one against the map
# before you demo. Open mumbai.pmtiles in the console, or check the
# location in OSM, and correct the lat/lon here. The ETL snaps each
# venue to the nearest graph node, so being ~100 m off is tolerable;
# being in the wrong neighbourhood is not.
#
# Capacities and service rates are tunable modelling assumptions,
# not measured figures. Say so if a judge asks.

festival:
  name: Ganesh Chaturthi
  # VERIFY this date. Day 1 is Chaturthi; day 11 is Anant Chaturdashi.
  start_date: "2026-09-14"
  days: 11
  # Days on which immersion happens. Day 11 is the big one.
  immersion_days: [2, 4, 6, 8, 11]
  peak_day: 11

# --- Pandals: darshan venues. These are queue systems. ---------------
pandals:
  - id: pandal_lalbaug
    name: Lalbaugcha Raja
    lat: 18.9930
    lon: 72.8320
    capacity: 12000          # people on site at once
    service_rate: 70         # people per minute through mukh darshan
    draw_weight: 1.0         # share of total darshan demand

  - id: pandal_ganesh_galli
    name: Mumbaicha Raja (Ganesh Galli)
    lat: 18.9945
    lon: 72.8310
    capacity: 7000
    service_rate: 50
    draw_weight: 0.55

  - id: pandal_gsb
    name: GSB Seva Mandal (King's Circle)
    lat: 19.0270
    lon: 72.8570
    capacity: 6000
    service_rate: 45
    draw_weight: 0.45

  - id: pandal_andheri
    name: Andhericha Raja
    lat: 19.1140
    lon: 72.8560
    capacity: 5000
    service_rate: 40
    draw_weight: 0.35

  - id: pandal_khetwadi
    name: Khetwadi Cha Ganraj
    lat: 18.9540
    lon: 72.8230
    capacity: 4000
    service_rate: 35
    draw_weight: 0.30

  - id: pandal_chinchpokli
    name: Chinchpoklicha Chintamani
    lat: 18.9880
    lon: 72.8330
    capacity: 3500
    service_rate: 30
    draw_weight: 0.25

# --- Immersion points: the destinations processions converge on ------
immersion_points:
  - id: imm_girgaum
    name: Girgaum Chowpatty
    lat: 18.9540
    lon: 72.8120
    capacity: 60000
    service_rate: 25         # idols immersed per hour
    is_natural: true

  - id: imm_dadar
    name: Dadar Chowpatty
    lat: 19.0270
    lon: 72.8360
    capacity: 35000
    service_rate: 18
    is_natural: true

  - id: imm_juhu
    name: Juhu Beach
    lat: 19.0990
    lon: 72.8265
    capacity: 45000
    service_rate: 20
    is_natural: true

  - id: imm_versova
    name: Versova Beach
    lat: 19.1370
    lon: 72.8100
    capacity: 25000
    service_rate: 14
    is_natural: true

  - id: imm_powai
    name: Powai Lake
    lat: 19.1270
    lon: 72.9050
    capacity: 15000
    service_rate: 12
    is_natural: true

  - id: imm_marve
    name: Marve Beach
    lat: 19.2000
    lon: 72.7900
    capacity: 12000
    service_rate: 10
    is_natural: true

# --- Holding areas: staging lots that meter flow inward --------------
holding_areas:
  - id: hold_wadala
    name: Wadala staging ground
    lat: 19.0180
    lon: 72.8600
    capacity: 20000
    service_rate: 300        # release rate, people per minute

  - id: hold_bkc
    name: BKC ground
    lat: 19.0650
    lon: 72.8680
    capacity: 25000
    service_rate: 350

# --- Processions: pandal to immersion point, on immersion days -------
# duration_h is how long the procession takes end to end.
processions:
  - pandal: pandal_lalbaug
    immersion: imm_girgaum
    days: [11]
    start_hour: 11
    duration_h: 20
    crowd: 400000

  - pandal: pandal_ganesh_galli
    immersion: imm_girgaum
    days: [11]
    start_hour: 12
    duration_h: 16
    crowd: 180000

  - pandal: pandal_chinchpokli
    immersion: imm_girgaum
    days: [11]
    start_hour: 13
    duration_h: 14
    crowd: 90000

  - pandal: pandal_gsb
    immersion: imm_dadar
    days: [6]
    start_hour: 10
    duration_h: 8
    crowd: 120000

  - pandal: pandal_andheri
    immersion: imm_juhu
    days: [11]
    start_hour: 14
    duration_h: 10
    crowd: 150000

  - pandal: pandal_khetwadi
    immersion: imm_girgaum
    days: [4, 11]
    start_hour: 15
    duration_h: 8
    crowd: 70000

# --- Darshan windows: daily queueing at each pandal ------------------
darshan:
  open_hour: 6
  close_hour: 24
  # Multiplier on baseline darshan demand, per festival day.
  day_weights:
    1: 0.7
    2: 0.9
    3: 1.0
    4: 1.0
    5: 1.1
    6: 1.2
    7: 1.2
    8: 1.3
    9: 1.4
    10: 1.6
    11: 1.9
  baseline_daily_visitors: 900000
