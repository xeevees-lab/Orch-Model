# Interchange walking links between co-located stations on different
# lines. Without these the twin cannot move anyone between lines.
interchanges:
  - [Dadar, Dadar]
  - [Kurla, Kurla]
  - [Andheri, Andheri]
  - [Ghatkopar, Ghatkopar]
  - [Chhatrapati Shivaji Maharaj Terminus, Chhatrapati Shivaji Maharaj Terminus]

# Peak window used when deciding which headway applies.
peak_hours: [7, 11, 17, 22]
