# Mumbai rail and metro lines.
#
# Station COORDINATES are not listed here on purpose - they are pulled
# from mumbai.osm.pbf by name, so nothing is hand-typed and wrong.
# What is hand-authored is the line ORDER, the headways and the
# per-train capacity. Those are the numbers to defend.
#
# Capacity note: Mumbai locals run far above seated capacity. 2500 is
# a crush-load figure for a 12-car rake, which is the honest number for
# a visarjan evening. Metro rakes are ~1100.
#
# 04_load_rail.py reports every station it could not match. Expect a
# few - fix them by adding the OSM spelling to `aliases`.

lines:
  - id: wr_local
    name: Western Line
    mode: rail
    capacity_per_vehicle: 2500
    headway_peak_min: 3
    headway_offpeak_min: 6
    stations:
      - Churchgate
      - Marine Lines
      - Charni Road
      - Grant Road
      - Mumbai Central
      - Mahalaxmi
      - Lower Parel
      - Prabhadevi
      - Dadar
      - Matunga Road
      - Mahim Junction
      - Bandra
      - Khar Road
      - Santacruz
      - Vile Parle
      - Andheri
      - Jogeshwari
      - Ram Mandir
      - Goregaon
      - Malad
      - Kandivali
      - Borivali
      - Dahisar
    aliases:
      Prabhadevi: [Elphinstone Road]
      Mahim Junction: [Mahim]
      Santacruz: [Santa Cruz]

